
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter Defender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Shooter Defender</h1>
        <p>
            Setas ou A/D para mover.
            ESPAÇO ou ↑ para atirar.
            X para tiro especial.
            P para pausar.
        </p>
    </header>

    <div class="hud">
        <span>Pontos: <strong id="score">0</strong></span>
        <span>Vidas: <strong id="lives">3</strong></span>
        <span>Ondas: <strong id="wave">1</strong></span>
        <span>Fugas: <strong id="escapes">0/5</strong></span>
        <span>Tiro X: <strong id="special">PRONTO</strong></span>
    </div>

    <canvas id="game" width="480" height="640"></canvas>

    <script src="script.js"></script>

</body>
</html>
